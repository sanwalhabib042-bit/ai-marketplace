<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnliImages AI Studio - Higgsfield Style</title>
    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(30, 41, 59, 0.6);
            --accent: #06b6d4; /* Cyan Color */
            --accent-hover: #22d3ee;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 2rem 1rem;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 50%);
        }

        /* Header */
        header { text-align: center; margin-bottom: 2rem; width: 100%; max-width: 800px; }
        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 0.5rem; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: var(--text-muted); font-size: 1rem; max-width: 600px; margin: 0 auto; line-height: 1.5; }

        /* Navigation Tabs */
        .tabs { display: flex; gap: 0.5rem; background: rgba(15, 23, 42, 0.8); padding: 0.4rem; border-radius: 1rem; border: 1px solid var(--border); margin-bottom: 2rem; backdrop-filter: blur(10px); }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.6rem 1.2rem; cursor: pointer; border-radius: 0.75rem; font-weight: 600; transition: all 0.3s ease; font-size: 0.9rem; }
        .tab-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
        .tab-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.05); }

        /* Main Workspace */
        .workspace { width: 100%; max-width: 800px; display: none; animation: fadeIn 0.4s ease; }
        .workspace.active { display: block; }

        /* Cards & Inputs */
        .glass-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1.5rem; padding: 1.5rem; backdrop-filter: blur(12px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        
        .input-group { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        input[type="text"] { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 0.9rem 1.2rem; border-radius: 0.8rem; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; min-width: 200px; }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2); }
        
        .action-btn { background: var(--accent); color: #000; border: none; padding: 0.9rem 1.8rem; border-radius: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap; font-size: 0.95rem; }
        .action-btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 5px 15px rgba(6, 182, 212, 0.3); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Media Display Area */
        .media-stage { min-height: 250px; background: rgba(0,0,0,0.3); border-radius: 1rem; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; margin-top: 1rem; padding: 1rem; }
        img, video { max-width: 100%; max-height: 500px; border-radius: 0.5rem; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: contain; }
        
        .loader { width: 35px; height: 35px; border: 3px solid rgba(255,255,255,0.1); border-left-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        
        /* Utility Buttons inside stage */
        .stage-controls { position: absolute; bottom: 1rem; right: 1rem; display: none; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; width: 100%; padding-right: 1rem; }
        .icon-btn { background: rgba(15, 23, 42, 0.8); color: #fff; border: 1px solid var(--border); padding: 0.5rem 0.8rem; border-radius: 0.5rem; cursor: pointer; backdrop-filter: blur(5px); font-size: 0.8rem; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .icon-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        /* File Upload Styling */
        .upload-area { text-align: center; padding: 3rem 1rem; cursor: pointer; transition: 0.3s; border-radius: 1rem; border: 2px dashed var(--border); width: 100%; }
        .upload-area:hover { background: rgba(6, 182, 212, 0.05); border-color: var(--accent); }
        .upload-text { color: var(--text-muted); margin-top: 10px; font-size: 0.9rem; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .input-group { flex-direction: column; }
            .action-btn { width: 100%; }
            .tabs { width: 100%; overflow-x: auto; white-space: nowrap; }
            .stage-controls { position: static; margin-top: 10px; justify-content: center; padding: 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>UnliImages AI Studio</h1>
        <p class="subtitle">Next-gen creative tools powered by free open-source models. No limits, no subscriptions.</p>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('image')">✨ Text to Image</button>
        <button class="tab-btn" onclick="switchTab('video')">🎬 Text to Video</button>
        <button class="tab-btn" onclick="switchTab('upload')">📤 Image Upload</button>
    </div>

    <!-- 1. TEXT TO IMAGE WORKSPACE -->
    <div id="tab-image" class="workspace active">
        <div class="glass-card">
            <div class="input-group">
                <input type="text" id="img-prompt" placeholder="Describe your imagination... (e.g., Cyberpunk street in Lahore)">
                <button class="action-btn" id="gen-img-btn" onclick="generateImage()">Generate Image</button>
            </div>
            
            <div class="media-stage" id="img-stage">
                <div class="loader" id="img-loader"></div>
                <img id="result-image" src="" alt="Generated Art">
                
                <div class="stage-controls" id="img-controls">
                    <button class="icon-btn" onclick="upscaleImage()"> Upscale 2x</button>
                    <button class="icon-btn" onclick="downloadMedia('result-image', 'unliimages-art.png')"> Download</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. TEXT TO VIDEO WORKSPACE -->
    <div id="tab-video" class="workspace">
        <div class="glass-card">
            <div class="input-group">
                <input type="text" id="vid-prompt" placeholder="Describe motion... (e.g., A drone flying over mountains)">
                <button class="action-btn" id="gen-vid-btn" onclick="generateVideo()">Generate Video</button>
            </div>
            
            <div class="media-stage" id="vid-stage">
                <div class="loader" id="vid-loader"></div>
                <video id="result-video" controls></video>
                <div class="stage-controls" id="vid-controls">
                    <button class="icon-btn" onclick="downloadMedia('result-video', 'unliimages-clip.mp4')">⬇ Download Video</button>
                </div>
            </div>
            <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:10px;">Note: Video uses free HuggingFace API (may be slow)</p>
        </div>
    </div>

    <!-- 3. UPLOAD WORKSPACE -->
    <div id="tab-upload" class="workspace">
        <div class="glass-card">
            <label for="file-upload" class="upload-area">
                <div style="font-size: 2rem; margin-bottom: 10px;">️</div>
                <strong style="color: var(--accent);">Click to Upload</strong> or drag and drop
                <div class="upload-text">SVG, PNG, JPG or GIF (max. 800x400px)</div>
            </label>
            <input type="file" id="file-upload" accept="image/*" style="display: none;" onchange="previewUpload(event)">
            
            <div class="media-stage" id="upload-stage" style="display:none; margin-top: 1rem;">
                <img id="uploaded-preview" src="" alt="Uploaded Preview">
                <div class="stage-controls" style="display:flex;">
                    <button class="icon-btn" onclick="document.getElementById('file-upload').click()">🔄 Change Image</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- TAB SWITCHING LOGIC ---
        function switchTab(tabName) {
            // Hide all workspaces
            document.querySelectorAll('.workspace').forEach(el => el.classList.remove('active'));
            // Deactivate all buttons
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            // Show selected
            document.getElementById(`tab-${tabName}`).classList.add('active');
            // Activate button (finding by index or text is tricky, so simple loop logic:)
            const btns = document.querySelectorAll('.tab-btn');
            if(tabName === 'image') btns[0].classList.add('active');
            if(tabName === 'video') btns[1].classList.add('active');
            if(tabName === 'upload') btns[2].classList.add('active');
        }

        // --- 1. IMAGE GENERATION (Pollinations.ai) ---
        function generateImage() {
            const prompt = document.getElementById('img-prompt').value;
            const img = document.getElementById('result-image');
            const loader = document.getElementById('img-loader');
            const controls = document.getElementById('img-controls');
            const btn = document.getElementById('gen-img-btn');
            
            if(!prompt) return alert("Please write a prompt first!");
            
            loader.style.display = 'block';
            img.style.display = 'none';
            controls.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Generating...";
            
            const seed = Math.floor(Math.random() * 100000);
            // High quality params
            img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;
            
            img.onload = () => {
                loader.style.display = 'none';
                img.style.display = 'block';
                controls.style.display = 'flex';
                btn.disabled = false;
                btn.innerText = "Generate Image";
            };
            
            img.onerror = () => {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "Try Again";
                alert("Error generating image. Please try again.");
            };
        }

        // --- 2. VIDEO GENERATION (Hugging Face Free Tier) ---
        async function generateVideo() {
            const prompt = document.getElementById('vid-prompt').value;
            const video = document.getElementById('result-video');
            const loader = document.getElementById('vid-loader');
            const controls = document.getElementById('vid-controls');
            const btn = document.getElementById('gen-vid-btn');
            
            if(!prompt) return alert("Please write a video prompt!");
            
            loader.style.display = 'block';
            video.style.display = 'none';
            controls.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Processing...";

            // IMPORTANT: Replace with your token if you have one, otherwise it might fail or be very slow
            const HF_TOKEN = "hf_YOUR_FREE_TOKEN_HERE"; 

            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/damo-vilab/text-to-video-ms-1.7b",
                    {
                        headers: { Authorization: `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt }),
                    }
                );
                
                if (!response.ok) throw new Error("API Limit or Error");
                
                const blob = await response.blob();
                video.src = URL.createObjectURL(blob);
                video.style.display = 'block';
                controls.style.display = 'flex';
                video.play();
            } catch (err) {
                alert("Video generation failed (Common with free API). Try again later or check token.");
                console.error(err);
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "Generate Video";
            }
        }

        // --- 3. UPLOAD PREVIEW ---
        function previewUpload(event) {
            const file = event.target.files[0];
            const stage = document.getElementById('upload-stage');
            const preview = document.getElementById('uploaded-preview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    stage.style.display = 'flex'; // Use flex to keep controls aligned
                    stage.style.flexDirection = 'column';
                }
                reader.readAsDataURL(file);
            }
        }

        // --- 4. UPSCALE (Client Side Simulation) ---
        function upscaleImage() {
            const img = document.getElementById('result-image');
            if (!img.src || img.style.display === 'none') return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Double resolution
            canvas.width = img.naturalWidth * 2;
            canvas.height = img.naturalHeight * 2;
            
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            img.src = canvas.toDataURL('image/png');
            alert("✅ Image upscaled to higher resolution locally!");
        }

        // --- 5. DOWNLOAD FUNCTION ---
        function downloadMedia(elementId, filename) {
            const element = document.getElementById(elementId);
            if (!element.src) return;

            const link = document.createElement('a');
            link.href = element.src;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
